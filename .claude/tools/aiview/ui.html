<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>aiview</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1f2328; --muted: #6b7280; --line: #e5e1d8; --panel: #f3f1ea;
    --accent: #1f5f8b; --accent-soft: #e3eef6; --code: #efece4; --chip: #e8e4d9;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --fg: #e6e6e6; --muted: #9aa0a6; --line: #2a2e36; --panel: #1d2026;
            --accent: #7fb3d5; --accent-soft: #1e2a35; --code: #22262e; --chip: #2a2f38; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--line); background: var(--panel); padding: 1rem; position: sticky; top: 0; height: 100vh; overflow: auto; font-size: 0.85rem; }
  aside h1 { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.8rem; }
  main { padding: 2.5rem 3rem 5rem; max-width: 62rem; width: 100%; justify-self: center; min-width: 0; }
  input[type=search] { width: 100%; font: inherit; font-size: 0.85rem; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 0.4rem 0.6rem; margin-bottom: 0.6rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.8rem; }
  .chip { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 999px; background: var(--chip); color: var(--fg); border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--accent); color: #fff; }
  .chip.static { cursor: default; }
  /* kind: the mandatory primary chip — filled, coloured per kind (hue set inline), always distinct from grey tags */
  .kind { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.18rem 0.55rem; border-radius: 4px;
          background: hsl(var(--h) 55% 42%); color: #fff; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
  .kind.off { background: hsl(var(--h) 35% 90%); color: hsl(var(--h) 45% 30%); }
  @media (prefers-color-scheme: dark) { .kind.off { background: hsl(var(--h) 30% 22%); color: hsl(var(--h) 60% 75%); } }
  .kind.static { cursor: default; }
  .rowlabel { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 0.2rem 0 0.25rem; }
  /* start date-time: first-class, monospace, on its own line */
  .started { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.74rem; font-variant-numeric: tabular-nums; color: var(--fg); background: var(--code); padding: 0.1rem 0.4rem; border-radius: 4px; }
  .started b { font-weight: 600; }
  .updated { color: var(--muted); font-size: 0.7rem; }
  .doctitle { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 0.5rem; text-wrap: balance; }
  .dochead { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.4rem; font-size: 0.8rem; }
  .spacer { flex: 1; }
  .headrow { justify-content: space-between; width: 100%; }
  .viewbar[hidden] { display: none; }
  .viewbar { display: flex; gap: 0.3rem; align-items: center; margin-bottom: 0.8rem; font-size: 0.75rem; color: var(--muted); }
  .viewbar button { font: inherit; font-size: 0.72rem; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 0.2rem 0.5rem; cursor: pointer; }
  .viewbar button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .frameWrap { display: flex; justify-content: center; }
  iframe.mock { border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%; height: calc(100vh - 9rem); max-width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.08); transition: width .2s; }
  main.wide { max-width: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.doc { padding: 0.5rem 0.6rem; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 0.25rem; }
  li.doc:hover { background: var(--accent-soft); }
  li.doc.active { background: var(--accent-soft); outline: 1px solid var(--accent); }
  li.doc .title { font-weight: 600; line-height: 1.3; }
  li.doc .meta { color: var(--muted); font-size: 0.72rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  li.doc.missing .title { text-decoration: line-through; color: var(--muted); }
  .status { color: var(--muted); font-size: 0.72rem; margin-top: 1rem; }
  .empty { color: var(--muted); }
  /* markdown */
  #doc h1 { font-size: 1.9rem; margin-top: 0; text-wrap: balance; }
  #doc h2 { margin-top: 2.2rem; border-bottom: 1px solid var(--line); padding-bottom: 0.3rem; }
  #doc h3 { margin-top: 1.6rem; }
  #doc p, #doc li { line-height: 1.55; }
  #doc code { background: var(--code); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
  #doc pre { background: var(--code); padding: 0.9rem 1rem; border-radius: 8px; overflow-x: auto; }
  #doc pre code { background: none; padding: 0; }
  #doc table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
  #doc th, #doc td { border: 1px solid var(--line); padding: 0.4rem 0.6rem; vertical-align: top; text-align: left; }
  #doc th { background: var(--panel); }
  #doc blockquote { border-left: 3px solid var(--accent); margin: 0; padding: 0.2rem 1rem; color: var(--muted); }
  #doc a { color: var(--accent); }
  #doc .mermaid { display: flex; justify-content: center; margin: 1rem 0; overflow-x: auto; }
  #doc .mermaid svg { max-width: 100%; height: auto; }
  #doc del { color: var(--muted); }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; } aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); } main { padding: 1.5rem; } }
</style>
</head>
<body>
<aside>
  <h1>Documents</h1>
  <input type="search" id="q" placeholder="filter by title or path…" />
  <div class="rowlabel">Kind</div>
  <div class="tags" id="kinds"></div>
  <div class="rowlabel">Tags</div>
  <div class="tags" id="tags"></div>
  <ul id="docs"></ul>
  <div class="status" id="status">connecting…</div>
</aside>
<main id="main"><h1 class="doctitle" id="doctitle"></h1><div class="dochead" id="dochead"></div><div class="viewbar" id="viewbar" hidden></div><article id="doc"><p class="empty">Pick a document on the left.</p></article></main>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/mermaid.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral", securityLevel: "loose" });

const state = { docs: [], current: null, kindFilter: new Set(), tagFilter: new Set(), q: "" };
const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
const kindChip = (k, on, cls = "") => `<span class="kind ${on ? "" : "off"} ${cls}" style="--h:${hue(k)}" data-kind="${esc(k)}">${esc(k)}</span>`;
const pad = (n) => String(n).padStart(2, "0");
const fmtStart = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} <b>${pad(d.getHours())}:${pad(d.getMinutes())}</b>`; };

const renderer = new marked.Renderer();
const baseCode = renderer.code.bind(renderer);
renderer.code = function (token) {
  if ((token.lang || "") === "mermaid") return `<div class="mermaid">${esc(token.text)}</div>`;
  return baseCode(token);
};
marked.setOptions({ gfm: true, renderer });
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const fmt = (iso) => { const d = new Date(iso); return d.toLocaleDateString(undefined, { month: "short", day: "2-digit" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); };
const projectName = (p) => p.replace(/[\\/]+$/, "").split(/[\\/]/).pop();

async function renderMarkdown(md) {
  $("#main").classList.remove("wide"); $("#viewbar").hidden = true;
  $("#doc").innerHTML = marked.parse(md);
  try { await mermaid.run({ nodes: $("#doc").querySelectorAll(".mermaid") }); } catch (e) { console.warn("mermaid", e); }
}
const VIEWPORTS = [["mobile", 390], ["tablet", 820], ["laptop", 1280], ["full", 0]];
let viewport = localStorage.getItem("aiview.viewport") || "full";
function renderHtml(html) {
  $("#main").classList.add("wide"); $("#viewbar").hidden = false;
  $("#viewbar").innerHTML = `<span>viewport</span>` + VIEWPORTS.map(([n]) => `<button class="${n === viewport ? "on" : ""}" data-vp="${n}">${n}</button>`).join("") + `<span id="vpsize"></span>`;
  $("#viewbar").querySelectorAll("button").forEach((b) => b.onclick = () => { viewport = b.dataset.vp; localStorage.setItem("aiview.viewport", viewport); renderHtml(html); });
  const w = VIEWPORTS.find(([n]) => n === viewport)?.[1] || 0;
  // sandboxed: the mockup's own scripts run, but it cannot touch the viewer, storage, or navigate the top window
  $("#doc").innerHTML = `<div class="frameWrap"><iframe class="mock" sandbox="allow-scripts allow-forms allow-modals allow-popups" style="${w ? `width:${w}px` : ""}"></iframe></div>`;
  $("#doc iframe").srcdoc = html;
  $("#vpsize").textContent = w ? `${w}px` : "";
}

function renderSidebar() {
  const allKinds = [...new Set(state.docs.map((d) => d.kind))].sort();
  const noKindFilter = state.kindFilter.size === 0;
  $("#kinds").innerHTML = allKinds.map((k) => kindChip(k, noKindFilter || state.kindFilter.has(k))).join("") || `<span class="empty">—</span>`;
  $("#kinds").querySelectorAll(".kind").forEach((el) => el.onclick = () => { const k = el.dataset.kind; state.kindFilter.has(k) ? state.kindFilter.delete(k) : state.kindFilter.add(k); renderSidebar(); });
  const allTags = [...new Set(state.docs.flatMap((d) => d.tags))].sort();
  $("#tags").innerHTML = allTags.map((t) => `<span class="chip ${state.tagFilter.has(t) ? "on" : ""}" data-tag="${esc(t)}">${esc(t)}</span>`).join("") || `<span class="empty">—</span>`;
  $("#tags").querySelectorAll(".chip").forEach((el) => el.onclick = () => { const t = el.dataset.tag; state.tagFilter.has(t) ? state.tagFilter.delete(t) : state.tagFilter.add(t); renderSidebar(); });
  const q = state.q.toLowerCase();
  const shown = state.docs.filter((d) =>
    (noKindFilter || state.kindFilter.has(d.kind)) &&
    [...state.tagFilter].every((t) => d.tags.includes(t)) &&
    (!q || (d.title || "").toLowerCase().includes(q) || d.file_path.toLowerCase().includes(q)));
  $("#docs").innerHTML = shown.map((d) => `
    <li class="doc ${d.id === state.current ? "active" : ""} ${d.exists ? "" : "missing"}" data-id="${d.id}">
      <span class="meta headrow"><span class="started">${fmtStart(d.created_at)}</span>${kindChip(d.kind, true, "static")}</span>
      <span class="title">${esc(d.title || "(untitled)")}</span>
      <span class="meta">${d.tags.map((t) => `<span class="chip static">${esc(t)}</span>`).join("")}<span>${esc(projectName(d.project))}</span><span class="updated">updated ${fmt(d.last_seen_at)}</span></span>
    </li>`).join("") || `<li class="empty">no documents</li>`;
  $("#docs").querySelectorAll("li.doc").forEach((el) => el.onclick = () => open(Number(el.dataset.id)));
  $("#status").textContent = `${state.docs.length} documents · index: aiview.sqlite next to the tool (versioned)`;
}

async function loadIndex() {
  const data = await (await fetch("/api/documents")).json();
  state.docs = data.documents;
  renderSidebar();
  return data;
}

async function open(id, push = true) {
  const data = await (await fetch(`/api/document/${id}`)).json();
  state.current = id;
  if (push) location.hash = `doc=${id}`;
  document.title = data.document?.title || "aiview";
  const d = data.document;
  $("#doctitle").textContent = d.title || "(untitled)";
  $("#dochead").innerHTML = `<span class="started">started ${fmtStart(d.created_at)}</span>${d.tags.map((t) => `<span class="chip static">${esc(t)}</span>`).join("")}<span class="updated">${esc(projectName(d.project))} · updated ${fmt(d.last_seen_at)}</span><span class="spacer"></span>${kindChip(d.kind, true, "static")}`;
  if (data.content == null) $("#doc").innerHTML = `<p class="empty">File is missing on disk: <code>${esc(data.document.abs_path || data.document.file_path)}</code></p>`;
  else if (data.format === "html") renderHtml(data.content);
  else await renderMarkdown(data.content);
  renderSidebar();
}

$("#q").oninput = (e) => { state.q = e.target.value; renderSidebar(); };
window.addEventListener("hashchange", () => { const m = location.hash.match(/doc=(\d+)/); if (m && Number(m[1]) !== state.current) open(Number(m[1]), false); });

const es = new EventSource("/events");
es.onmessage = async (e) => {
  const ev = JSON.parse(e.data);
  if (ev.type === "changed") { await loadIndex(); if (ev.id === state.current) open(ev.id, false); }
};
es.onerror = () => { $("#status").textContent = "disconnected — is aiview still running?"; };

(async () => {
  const data = await loadIndex();
  const m = location.hash.match(/doc=(\d+)/);
  const id = m ? Number(m[1]) : data.start ?? state.docs[0]?.id;
  if (id) open(id, !m);
})();
</script>
</body>
</html>
