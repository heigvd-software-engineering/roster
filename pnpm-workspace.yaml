packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  "@prisma/client": false
  better-sqlite3: false
# Dedupe better-call to the version better-auth@1.6.x core pins (1.3.7); the
# lagging @better-auth/cli@1.4.21 otherwise pulls the older better-call its own
# chain pins (1.1.8) and schema generation breaks. This force-upgrades the
# CLI's chain — it works because better-call stays compatible for `generate`,
# not because the ranges agree. Remove once the CLI catches up to core.
overrides:
  better-call: "1.3.7"
