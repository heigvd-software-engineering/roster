packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  "@prisma/client": false
  better-sqlite3: false
# Adding a dependency re-resolves transitive ranges, and octokit's `^27`/`^16`
# then float to typings that widen every GitHub id to `number | bigint` —
# breaking lib/github everywhere for reasons unrelated to whatever was added.
# Pinned to what the tree was verified against; revisit deliberately, since
# taking the newer typings is a real change to how ids are handled.
overrides:
  "@octokit/openapi-types": "27.0.0"
  "@octokit/types": "16.0.0"
  # zod floated 4.4.3 → 4.5.1, which builds a second better-call against the
  # newer zod — and two better-calls mean two OpenAPIParameter types, so a
  # Better Auth plugin built against one stops being assignable to the other's
  # BetterAuthPlugin. Scoped to better-call: pinning zod workspace-wide breaks
  # packages that legitimately use zod 3 (`z.ostring is not a function`).
  "better-call>zod": "4.4.3"
